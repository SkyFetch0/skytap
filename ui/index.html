<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SkyTap</title>
<style>
:root {
  --bg:#0c0c0d; --panel:#161618; --elev:#1c1c1f; --line:#2a2a2e;
  --text:#f4f4f5; --muted:#a1a1aa; --acc:#c4a574; --acc2:#8b7355;
  --ok:#34d399; --warn:#eab308; --bad:#f87171; --radius:8px;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; font:13px/1.45 var(--sans); background:var(--bg); color:var(--text); }
html[dir="rtl"] { direction:rtl; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:#3f3f46; border-radius:8px; }
* { scrollbar-width:thin; scrollbar-color:#3f3f46 var(--bg); }

header {
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel);
}
.brand { font-size:14px; font-weight:650; letter-spacing:.18em; margin:0; color:var(--acc); }
.pill { font-size:10px; padding:3px 8px; border-radius:99px; background:var(--elev); color:var(--muted); border:1px solid var(--line); }
.pill.ok { color:var(--ok); border-color:#14532d; }
.pill.warn { color:var(--warn); border-color:#713f12; }
.pill.bad { color:var(--bad); border-color:#7f1d1d; }
.grow { flex:1; min-width:8px; }
#lang { width:auto; min-width:7.5rem; }
main#wb {
  display:grid;
  grid-template-areas:
    "n n n"
    "w c e"
    "s s s";
  grid-template-rows: var(--n, 0px) minmax(0,1fr) var(--s, 0px);
  grid-template-columns: var(--w, 280px) minmax(0,1fr) var(--e, 340px);
  height:calc(100vh - 48px);
  min-height:0;
}
.slot { min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
.slot[data-empty="1"] { display:none; }
#slot-n { grid-area:n; border-bottom:1px solid var(--line); }
#slot-s { grid-area:s; border-top:1px solid var(--line); }
#slot-w { grid-area:w; border-right:1px solid var(--line); }
#slot-e { grid-area:e; border-left:1px solid var(--line); }
#slot-c { grid-area:c; min-width:180px; }
.slot { position:relative; }
.sash { position:absolute; z-index:6; background:transparent; }
.sash-v { width:5px; top:0; bottom:0; cursor:col-resize; }
.sash-h { height:5px; left:0; right:0; cursor:row-resize; }
#slot-w .sash-v { inset-inline-end:-2px; }
#slot-e .sash-v { inset-inline-start:-2px; }
#slot-n .sash-h { bottom:-2px; }
#slot-s .sash-h { top:-2px; }
.sash:hover, .sash.drag { background:var(--acc2); }
.pane {
  display:flex; flex-direction:column; min-height:0; min-width:0; flex:1; overflow:hidden;
  background:var(--bg);
}
.pane-bar {
  display:flex; align-items:center; gap:6px; flex-shrink:0;
  padding:4px 8px; border-bottom:1px solid var(--line); background:var(--panel);
  user-select:none;
}
.pane-bar .pt { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; flex:1; }
.pane-bar button.dock {
  width:22px; height:22px; padding:0; font-size:11px; line-height:1;
  color:var(--muted); background:transparent; border-color:transparent;
}
.pane-bar button.dock:hover { color:var(--text); background:var(--elev); border-color:var(--line); }
.pane-bar button.dock.on { color:var(--acc); }
.pane .col { flex:1; overflow:auto; padding:12px 14px 28px; border:none; }
@media (max-width: 980px) {
  main#wb {
    display:flex; flex-direction:column; height:auto; min-height:calc(100vh - 48px);
  }
  .sash { display:none; }
  .slot { border:none !important; max-height:none; }
  .slot[data-empty="1"] { display:none; }
}
h2 { font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); margin:0 0 8px; font-weight:600; }
table { width:100%; border-collapse:collapse; }
th { font-size:10px; color:var(--muted); letter-spacing:.08em; font-weight:500; }
th,td { text-align:start; padding:8px 4px; border-bottom:1px solid var(--line); }
tr { cursor:pointer; }
tr:hover { background:var(--elev); }
tr.sel { background:#222225; box-shadow:inset 2px 0 0 var(--acc); }
html[dir="rtl"] tr.sel { box-shadow:inset -2px 0 0 var(--acc); }
select,input,textarea,button {
  font:inherit; background:var(--elev); color:var(--text);
  border:1px solid var(--line); border-radius:6px; padding:7px 9px; width:100%;
}
button { width:auto; cursor:pointer; }
button.primary { background:var(--acc); color:#1a140c; border-color:transparent; font-weight:650; }
button.ghost { background:transparent; }
button.danger { background:transparent; color:var(--bad); border-color:#7f1d1d; }
button:disabled { opacity:.4; cursor:not-allowed; }
.flow {
  padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius);
  margin-bottom:8px; cursor:pointer; background:var(--elev);
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
}
.flow:hover { border-color:var(--acc2); }
.flow.sel { border-color:var(--acc); }
.flow .m { font-weight:700; color:var(--acc); min-width:42px; font-size:11px; }
.badge { font-size:10px; padding:2px 6px; border-radius:4px; background:#27272a; color:var(--muted); }
.badge.mock { background:#422006; color:var(--warn); }
.badge.rw { background:#292524; color:var(--acc); }
pre { white-space:pre-wrap; word-break:break-all; background:#09090b; padding:8px; border-radius:6px; font-size:11px; max-height:140px; overflow:auto; margin:6px 0 0; }
label { display:block; font-size:11px; color:var(--muted); margin:8px 0 4px; }
input[type="checkbox"] { width:auto; }
.sw {
  display:flex; align-items:center; gap:10px; margin:8px 0;
  padding:8px 10px; border:1px solid var(--line); border-radius:6px;
  background:var(--panel); cursor:pointer; user-select:none;
}
.sw input { position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
.sw .kn {
  flex:0 0 36px; width:36px; height:20px; border-radius:99px;
  background:#3f3f46; border:1px solid var(--line); position:relative;
}
.sw .kn::after {
  content:""; position:absolute; top:2px; inset-inline-start:2px;
  width:14px; height:14px; border-radius:50%; background:#e4e4e7;
  transition: transform .15s ease, background .15s;
}
.sw input:checked + .kn { background:#3f2e16; border-color:var(--acc2); }
.sw input:checked + .kn::after { transform:translateX(16px); background:var(--acc); }
html[dir="rtl"] .sw input:checked + .kn::after { transform:translateX(-16px); }
.sw .swl { flex:1; min-width:0; font-size:12px; color:var(--text); line-height:1.3; }
.kit-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
@media (max-width: 420px) { .kit-grid { grid-template-columns:1fr; } }
#login { position:fixed; inset:0; background:rgba(0,0,0,.82); display:flex; align-items:center; justify-content:center; z-index:20; }
#login.hid { display:none; }
#login .box { background:var(--panel); padding:28px; border-radius:12px; width:min(360px,92vw); border:1px solid var(--line); }
.card { background:var(--elev); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; margin-top:14px; }
.hint { color:var(--muted); font-size:12px; margin:0 0 10px; }
details.card summary { cursor:pointer; list-style:none; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
details.card summary::-webkit-details-marker { display:none; }
.fp { font-family:ui-monospace,monospace; font-size:10px; color:var(--muted); }
.actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.rule-card { border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; margin-bottom:8px; background:var(--elev); }
.rule-card .rh { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.toast {
  position:fixed; bottom:16px; inset-inline-end:16px; background:var(--panel); border:1px solid var(--acc2);
  padding:10px 14px; border-radius:8px; z-index:30; display:none; max-width:min(360px,90vw);
}
.toast.show { display:block; }
.toast.err { border-color:var(--bad); }
.empty { color:var(--muted); padding:20px 12px; text-align:center; border:1px dashed var(--line); border-radius:var(--radius); font-size:12px; }
</style>
</head>
<body>
<header>
  <p class="brand">SKYTAP</p>
  <span class="pill" id="bindPill">—</span>
  <span class="pill" id="wsPill">ws</span>
  <span class="pill" id="caPill">CA</span>
  <span class="grow"></span>
  <select id="lang" aria-label="Language"></select>
  <button type="button" class="ghost" id="caBtn" data-i="ca_dl">Download CA</button>
</header>
<main id="wb">
  <div class="slot" id="slot-n" data-empty="1"></div>
  <div class="slot" id="slot-w"></div>
  <div class="slot" id="slot-c"></div>
  <div class="slot" id="slot-e"></div>
  <div class="slot" id="slot-s" data-empty="1"></div>
</main>
<template id="tpl-domains">
<div class="pane" data-pane="domains">
  <div class="pane-bar">
    <span class="pt" data-i="domains">Domains</span>
    <button type="button" class="dock" data-move="n" title="Top">▴</button>
    <button type="button" class="dock" data-move="s" title="Bottom">▾</button>
    <button type="button" class="dock" data-move="w" title="Left">◂</button>
    <button type="button" class="dock" data-move="e" title="Right">▸</button>
  </div>
  <div class="col">
    <p class="hint" data-i="domains_h">OBSERVED leaves TLS intact. INTERCEPT decrypts. MOCK returns a local reply.</p>
    <div class="actions" style="margin-bottom:8px">
      <button type="button" class="ghost" id="resetAllBtn" data-i="reset_all">Clear all</button>
    </div>
    <table>
      <thead><tr><th data-i="host">Host</th><th data-i="mode">Mode</th><th></th></tr></thead>
      <tbody id="domains"></tbody>
    </table>
    <details class="card" id="caCard">
      <summary data-i="ca_sum">Certificate</summary>
      <p class="hint" style="margin-top:8px" data-i="ca_h">Clients you decrypt must trust this CA. Detected OS chooses the install path.</p>
      <div id="caInstalled"></div>
      <div class="fp" id="caFp"></div>
      <div class="actions">
        <button type="button" class="primary" id="caTrustBtn" data-i="ca_install">Install CA here</button>
      </div>
    </details>
    <details class="card" id="pinCard" open>
      <summary data-i="pin_sum">SSL pin lab</summary>
      <p class="hint" style="margin-top:8px" data-i="pin_h">Pinning is in the lab client. This flag tells pin-lab to skip VerifyPeerCertificate (CA trust still required).</p>
      <div id="pinState" class="hint">bypass off</div>
      <div class="actions">
        <button type="button" class="primary" id="pinOnBtn" data-i="pin_on">Enable bypass</button>
        <button type="button" class="ghost" id="pinOffBtn" data-i="pin_off">Disable bypass</button>
      </div>
    </details>
    <details class="card" id="sslkitCard" open>
      <summary data-i="kit_sum">Patched client (this host)</summary>
      <p class="hint" style="margin-top:8px" data-i="kit_h">Only listed hosts get impersonate / kit policy. Capture pulls the real origin cert (public) into origin-cache.</p>
      <div id="kitHost" class="hint">—</div>
      <div id="kitSpki" class="fp"></div>
      <div id="kitMeta" class="hint"></div>
      <label class="sw"><input type="checkbox" id="kitEnable"/><span class="kn"></span><span class="swl" data-i="kit_en">Kit policy</span></label>
      <label class="sw"><input type="checkbox" id="kitImp"/><span class="kn"></span><span class="swl" data-i="kit_imp">Impersonate origin cert</span></label>
      <div class="kit-grid">
        <div>
          <label data-i="kit_pin">Pin</label>
          <select id="kitPin"><option value="off">off</option><option value="on">on</option></select>
        </div>
        <div>
          <label data-i="kit_ver">Verify</label>
          <select id="kitVer"><option value="ca">ca</option><option value="none">none</option></select>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="kitCapBtn" data-i="kit_cap">Capture origin cert</button>
        <button type="button" class="ghost" id="kitSaveBtn" data-i="kit_save">Save</button>
      </div>
    </details>
  </div>
</div>
</template>
<template id="tpl-traffic">
<div class="pane" data-pane="traffic">
  <div class="pane-bar">
    <span class="pt"><span data-i="traffic">Traffic</span> <span id="flowHost"></span></span>
    <button type="button" class="dock" data-move="n" title="Top">▴</button>
    <button type="button" class="dock" data-move="s" title="Bottom">▾</button>
    <button type="button" class="dock" data-move="w" title="Left">◂</button>
    <button type="button" class="dock" data-move="e" title="Right">▸</button>
  </div>
  <div class="col">
    <p class="hint" data-i="traffic_h">Select a host, then mock or rewrite a request.</p>
    <div class="actions" style="margin-bottom:8px">
      <button type="button" class="ghost" id="clearFlowsBtn" data-i="clear_flows">Clear requests</button>
    </div>
    <div id="flows"></div>
    <div id="detail"></div>
  </div>
</div>
</template>
<template id="tpl-rules">
<div class="pane" data-pane="rules">
  <div class="pane-bar">
    <span class="pt" data-i="rules">Rules</span>
    <button type="button" class="dock" data-move="n" title="Top">▴</button>
    <button type="button" class="dock" data-move="s" title="Bottom">▾</button>
    <button type="button" class="dock" data-move="w" title="Left">◂</button>
    <button type="button" class="dock" data-move="e" title="Right">▸</button>
  </div>
  <div class="col">
    <p class="hint" data-i="rules_h">Persisted on disk. Mock skips upstream; rewrite still forwards.</p>
    <div id="rulesList"></div>
    <h2 style="margin-top:18px" data-i="new_rule">New rule</h2>
    <p class="hint" id="ruleHint" data-i="rule_h"></p>
    <form id="ruleForm">
      <label data-i="kind">Kind</label>
      <select name="action">
        <option value="mock" data-i="kind_mock">Mock</option>
        <option value="rewrite" data-i="kind_rw">Rewrite</option>
      </select>
      <label data-i="host">Host</label><input name="host" required/>
      <label data-i="path">Path</label><input name="path" placeholder="/api/verify"/>
      <label data-i="method">Method</label><input name="method" placeholder="POST"/>
      <div id="mockFields">
        <label data-i="status">Status</label><input name="status" type="number" value="200"/>
        <label>Content-Type</label><input name="content_type" value="application/json"/>
        <label data-i="res_body">Response body</label>
        <textarea name="body" rows="5">{"ok":true}</textarea>
      </div>
      <div id="rewriteFields" style="display:none">
        <label data-i="rw_json">JSON fields to set</label>
        <textarea name="rewrite_json" rows="5">{
  "domain": "test.com"
}</textarea>
      </div>
      <label data-i="script_lbl">Script (starlark)</label>
      <textarea name="script" rows="3" placeholder="out = '{&quot;expires_at&quot;:&quot;' + date(86400*400) + '&quot;,&quot;next_check&quot;:' + str(plus(100)) + '}'"></textarea>
      <p class="hint" data-i="script_h">Optional. Sets the whole mock/rewrite body. Inline {{script: date(3600)}} and rewrite JSON value =plus(100) also work. Builtins: now, now_ms, iso, date, plus, path, host, method, query.</p>
      <div class="actions">
        <button class="primary" type="submit" data-i="save">Save</button>
      </div>
    </form>
  </div>
</div>
</template>
<div id="toast" class="toast"></div>
<div id="login">
  <div class="box">
    <h2 data-i="token">Admin token</h2>
    <p class="hint" data-i="token_h">Same as -admin-token</p>
    <input id="tok" type="password" autocomplete="off"/>
    <div class="actions"><button class="primary" id="tokBtn" style="width:100%" data-i="continue">Continue</button></div>
  </div>
</div>

const LAYOUT_KEY = "skytap_layout";
const PANES = ["domains","traffic","rules"];
const DEF_LAYOUT = { map:{domains:"w",traffic:"c",rules:"e"}, sizes:{w:280,e:340,n:180,s:200} };
let layout = (() => {
  try {
    const raw = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "{}") || {};
    return {
      map: Object.assign({}, DEF_LAYOUT.map, raw.map || {}),
      sizes: Object.assign({}, DEF_LAYOUT.sizes, raw.sizes || {})
    };
  } catch (e) {
    return { map: Object.assign({}, DEF_LAYOUT.map), sizes: Object.assign({}, DEF_LAYOUT.sizes) };
  }
})();
function saveLayout() { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); }
function slotEl(id) { return document.getElementById("slot-"+id); }
function paneNode(name) { return document.querySelector('.pane[data-pane="'+name+'"]'); }
function applySizes() {
  const wb = document.getElementById("wb");
  const used = new Set(Object.values(layout.map));
  wb.style.setProperty("--w", used.has("w") ? layout.sizes.w+"px" : "0px");
  wb.style.setProperty("--e", used.has("e") ? layout.sizes.e+"px" : "0px");
  wb.style.setProperty("--n", used.has("n") ? layout.sizes.n+"px" : "0px");
  wb.style.setProperty("--s", used.has("s") ? layout.sizes.s+"px" : "0px");
}
function mountWorkbench() {
  PANES.forEach(name => {
    if (paneNode(name)) return;
    const tpl = document.getElementById("tpl-"+name);
    document.body.appendChild(tpl.content.firstElementChild.cloneNode(true));
  });
  PANES.forEach(name => {
    const dest = layout.map[name] || "c";
    slotEl(dest).appendChild(paneNode(name));
  });
  ["n","s","w","e","c"].forEach(id => {
    const s = slotEl(id);
    s.dataset.empty = s.querySelector(".pane") ? "0" : "1";
  });
  document.querySelectorAll(".sash").forEach(x => x.remove());
  const used = new Set(Object.values(layout.map));
  [["w","sash-v"],["e","sash-v"],["n","sash-h"],["s","sash-h"]].forEach(([id, cls]) => {
    if (!used.has(id)) return;
    const sh = document.createElement("div");
    sh.className = "sash " + cls;
    sh.dataset.side = id;
    slotEl(id).appendChild(sh);
  });
  applySizes();
  document.querySelectorAll(".pane-bar .dock").forEach(btn => {
    const pane = btn.closest(".pane").dataset.pane;
    btn.classList.toggle("on", layout.map[pane] === btn.dataset.move);
    btn.onclick = () => movePane(pane, btn.dataset.move);
  });
  wireSashes();
}
function movePane(name, side) {
  const cur = layout.map[name];
  if (cur === side) return;
  const occupant = PANES.find(p => p !== name && layout.map[p] === side);
  if (occupant) layout.map[occupant] = cur;
  layout.map[name] = side;
  saveLayout();
  PANES.forEach(n => {
    const el = paneNode(n);
    if (el) document.body.appendChild(el);
  });
  mountWorkbench();
  applyI18n();
  bindUI();
  loadDomains();
  loadRules();
  loadCA();
  loadPin();
  if (selectedHost) loadKit();
  renderFlows();
}
function wireSashes() {
  document.querySelectorAll(".sash").forEach(sh => {
    sh.onmousedown = (e) => {
      e.preventDefault();
      sh.classList.add("drag");
      const side = sh.dataset.side;
      const start = side==="w"||side==="e" ? e.clientX : e.clientY;
      const orig = layout.sizes[side];
      const move = (ev) => {
        const d = (side==="w"||side==="e") ? ev.clientX-start : ev.clientY-start;
        let v = orig;
        if (side==="w" || side==="n") v = orig + d;
        else v = orig - d;
        v = Math.max(160, Math.min(720, v));
        layout.sizes[side] = v;
        applySizes();
      };
      const up = () => {
        sh.classList.remove("drag");
        window.removeEventListener("mousemove", move);
        window.removeEventListener("mouseup", up);
        saveLayout();
      };
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
    };
  });
}

function toast(msg, err) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (err ? " err" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2800);
}
function headers(json) {
  const h = {};
  if (json !== false) h["Content-Type"] = "application/json";
  if (token) h["Authorization"] = "Bearer " + token;
  return h;
}
async function api(path, opt) {
  const r = await fetch(path, Object.assign({ headers: headers() }, opt || {}));
  if (r.status === 401) { document.getElementById("login").classList.remove("hid"); throw new Error("401"); }
  if (!r.ok) throw new Error((await r.text()) || r.status);
  const ct = r.headers.get("content-type") || "";
  if (ct.includes("json")) return r.json();
  return r.text();
}

async function loadDomains() {

    tr.children[0].textContent = d.host;

    const forget = document.createElement("button");
    forget.type = "button";

function fillRuleFromFlow(f, mode) {
  const form = document.getElementById("ruleForm");
  form.host.value = f.host || selectedHost;
  form.path.value = f.path || "/";
  form.method.value = f.method || "GET";
  form.action.value = mode || "mock";
  toggleMode();
  if (mode === "rewrite") {
    form.rewrite_json.value = JSON.stringify({ domain: "test.com" }, null, 2);
  } else {
    form.status.value = f.status || 200;
    let body = f.res_body || "";
    if (f.res_encoding === "base64") body = "";
    form.body.value = body || '{"ok":true}';
    form.content_type.value = guessType(body);
  }
}
function guessType(body) {
  const x = (body||"").trim();
  if (x.startsWith("{") || x.startsWith("[")) return "application/json";
  if (x.startsWith("<")) return "text/html";
  return "text/plain";
}
function renderFlows() {

    el.querySelector(".rewbtn").onclick = (ev) => { ev.stopPropagation(); selectedFlow=f; fillRuleFromFlow(f,"rewrite"); toast(t("filled")); };
    el.onclick = () => {

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}
function renderRules() {

function bindUI() {

    const body = Object.fromEntries(fd.entries());
    const action = body.action || "mock";
    const payload = { host: body.host, path: body.path, method: body.method, action };
    if (body.script) payload.script = body.script;
    if (body.script) payload.script = body.script;
    if (action === "rewrite") {
      try { payload.rewrite_json = JSON.parse(body.rewrite_json || "{}"); }
      catch (err) { toast("JSON", true); return; }

      payload.content_type = body.content_type;
      payload.body = body.body;
    }
    await api("/rules", { method:"POST", body: JSON.stringify(payload) });
    if (payload.host) {
      const st = action === "rewrite" ? "INTERCEPTED" : "MOCKED";
      await api("/state?host=" + encodeURIComponent(payload.host) + "&state=" + st);

  };
  const caTrust = document.getElementById("caTrustBtn");

  const resetAll = document.getElementById("resetAllBtn");

    else flows = [];

    const det = document.getElementById("detail");
    if (det) det.innerHTML = "";

function paintCA(st) {
  lastCA = st;
  const pill = document.getElementById("caPill");
  const inst = document.getElementById("caInstalled");
  if (st.installed) { pill.textContent = "CA"; pill.className = "pill ok"; inst.textContent = t("ca_ok"); }
  else if (st.want_trust) { pill.textContent = "CA"; pill.className = "pill ok"; inst.textContent = t("ca_mark"); }
  else { pill.textContent = "CA"; pill.className = "pill warn"; inst.textContent = t("ca_no"); }
  const bits = [];
  if (st.distro) bits.push(st.distro);
  if (st.trust_path) bits.push(st.trust_path);
  document.getElementById("caFp").textContent = bits.join(" · ") + (st.fingerprint ? " · " + st.fingerprint.slice(0,12)+"…" : "");
  document.getElementById("caTrustBtn").disabled = !st.can_install;
}
async function loadCA() {

}
async function loadPin() {
  try {
    const st = await api("/pin-bypass");
    const el = document.getElementById("pinState");
    if (el) el.textContent = st.enabled ? t("pin_en") : t("pin_dis");
  } catch (e) {}
}
async function loadKit() {

  if (!selectedHost) {
    elH.textContent = t("kit_need");
    elS.textContent = "";
    elM.textContent = "";
    return;
  }
  elH.textContent = selectedHost;
  try {
    const p = await api("/sslkit?host=" + encodeURIComponent(selectedHost));
    document.getElementById("kitEnable").checked = !!p.kit;
    document.getElementById("kitImp").checked = !!p.impersonate;
    document.getElementById("kitPin").value = p.pin || "off";
    document.getElementById("kitVer").value = p.verify || "ca";
    elS.textContent = p.spki ? ("SPKI " + p.spki) : "";
    elM.textContent = (p.captured ? "captured · " : "not captured · ") + (p.subject || "") + (p.issuer ? " ← " + p.issuer : "");
  } catch (e) { elM.textContent = e.message; }
}
let sawSnapshot = false;
function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  let url = proto + "://" + location.host + "/ws";
  if (token) url += "?token=" + encodeURIComponent(token);
  const ws = new WebSocket(url);
  ws.onopen = () => { document.getElementById("wsPill").textContent = "live"; document.getElementById("wsPill").className = "pill ok"; };
  ws.onclose = () => { document.getElementById("wsPill").textContent = "ws"; document.getElementById("wsPill").className = "pill bad"; setTimeout(connectWS, 2000); };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "snapshot" && Array.isArray(msg.flows)) { flows = msg.flows; sawSnapshot = true; }
    else if (msg.type === "flow" && msg.flow) {
      if (!sawSnapshot) return;
      flows.push(msg.flow);
      if (flows.length > 500) flows = flows.slice(-400);
    }
    renderFlows();
  };
}
document.getElementById("caBtn").onclick = async () => {
  const r = await fetch("/ca.pem", { headers: headers(false) });
  if (!r.ok) return;
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "skytap-ca.pem";
  a.click();
};
async function boot() {
  try {
    const meta = await fetch("/meta").then(r => r.json());
    document.getElementById("bindPill").textContent = meta.bind || "";
    if (meta.auth_required && !token) { document.getElementById("login").classList.remove("hid"); return; }
    document.getElementById("login").classList.add("hid");
    await loadDomains();
    await loadRules();
    await loadCA();
    await loadPin();
    if (selectedHost) selectHost(selectedHost);
    connectWS();
    setInterval(loadDomains, 5000);
    setInterval(loadRules, 8000);
  } catch (e) {
    if (!token) document.getElementById("login").classList.remove("hid");
  }
}
boot();
</script>
